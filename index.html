<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Counter App - Vanilla JS</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 50px; }
    button { padding: 10px 20px; margin: 10px; font-size: 18px; }
    #count { font-size: 40px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Counter App - Vanilla JavaScript</h2>

  <div id="count">0</div>

  <button id="incBtn">Increase</button>
  <button id="decBtn">Decrease</button>
  <button id="resetBtn">Reset</button>

  <script src="script.js"></script>
</body>
</html>
